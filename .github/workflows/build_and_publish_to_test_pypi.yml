---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
    with:
      target: 'testpypi'
      environment-name: 'build_and_publish_to_test_pypi'
      use-local-wheel-action: true
      python-version: '3.13'
      check-changes: true
      changed-files-patterns: |
        include/**
        src/**
        interface/**
        ezsnmp_data_logger/**
        tools/**
        pyproject.toml
        setup.py
        requirements.txt
        .github/workflows/build_and_publish_to_test_pypi.yml
        .github/actions/build-wheels/**
        .github/actions/build-distribution/**
      third-party-repo: 'carlkidcrypto/ezsnmp'
      third-party-ref: 'v2026.11.24b0'
      third-party-path: 'third_party/ezsnmp'
      sdist-setup-cmd: >-
        sudo bash ./tools/prepare_linux_netsnmp.sh &&
        python3 tools/prepare_sqlite3_amalgamation.py &&
        python3 tools/prepare_ezsnmp_source.py &&
        echo "/usr/local/bin" >> "$GITHUB_PATH" &&
        echo "EZSNMP_NETSNMP_CONFIG=/usr/local/bin/net-snmp-config" >> "$GITHUB_ENV"
      skip-existing: true
      verify-metadata: false
      skip-publish: true

  publish:
    needs: build
    if: needs.build.outputs.artifacts-built == 'true'
    name: Publish distribution to TestPyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_test_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to TestPyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verify-metadata: false
          print-hash: true
