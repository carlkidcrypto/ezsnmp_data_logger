name: Desktop Distributions (EXE & DMG)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach desktop assets to (e.g. v2026.11.9)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in desktop application files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            include/**
            src/**
            interface/**
            ezsnmp_data_logger/**
            configs/**
            tools/**
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            .github/actions/prepare-windows-netsnmp/**
            pyproject.toml
            setup.py
            requirements.txt
            .github/workflows/build_and_publish_desktop_apps.yml

  package-desktop-apps:
    name: Package Desktop App (${{ matrix.os }})
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer beta v2026.11.9b0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.9b0
          path: third_party/ezsnmp

      - name: Cache compiled Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\ezsnmp-netsnmp-dist
          key: ${{ runner.os }}-netsnmp-5.10.pre2-x64-${{ hashFiles('.github/actions/prepare-windows-netsnmp/action.yml') }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential swig pkg-config patchelf \
              libssl-dev python3-tk rpm curl perl
            sudo bash ./tools/prepare_linux_netsnmp.sh
          macos: |
            brew install swig pkg-config openssl@3
            sudo bash ./tools/prepare_macos_netsnmp.sh
          windows: |
            choco install swig innosetup -y

      - name: Prepare Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows-netsnmp
        with:
          arch: x64

      - name: Build C++ extension and package standalone desktop app
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
            python -m pip install --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.9b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform linux
          macos: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export DYLD_LIBRARY_PATH="/usr/local/lib:${DYLD_LIBRARY_PATH}"
            python -m pip install --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.9b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform macos
          windows: |
            python -m pip install --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.9b0"
            $env:PATH = "C:\ezsnmp-netsnmp-dist\x64\bin\release;" + $env:PATH
            if (Test-Path "C:\ezsnmp-netsnmp-dist\x64\bin\release\netsnmp.dll") {
              Copy-Item "C:\ezsnmp-netsnmp-dist\x64\bin\release\*.dll" ezsnmp_data_logger/ -Force
            }
            if ($env:EZSNMP_OPENSSL_BIN_DIR -and (Test-Path $env:EZSNMP_OPENSSL_BIN_DIR)) {
              Copy-Item "$env:EZSNMP_OPENSSL_BIN_DIR\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL\bin") {
              Copy-Item "C:\Program Files\OpenSSL\bin\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\bin") {
              Copy-Item "C:\Program Files\OpenSSL-Win64\bin\*.dll" ezsnmp_data_logger/ -Force
            }
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged executable
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            ./dist/EzSnmpDataLogger cli version
          macos: |
            "./dist/EzSnmpDataLogger.app/Contents/MacOS/EzSnmpDataLogger" cli version
          windows: |
            .\dist\EzSnmpDataLogger.exe cli version

      - name: Upload desktop artifacts to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  publish-release-assets:
    name: Publish Desktop Assets to GitHub Release
    needs: [verify-syntax, package-desktop-apps]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-dist-*
          path: all-desktop-dist
          merge-multiple: true

      - name: Publish all desktop assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          if [ -z "$TARGET_TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TARGET_TAG" ]; then
            echo "Target release tag not specified; skipping GitHub Release asset upload."
            exit 0
          fi

          echo "Target Release Tag: ${TARGET_TAG}"
          echo "Target Repository: ${{ github.repository }}"
          if ! gh release view "${TARGET_TAG}" --repo "${{ github.repository }}"; then
            echo "::error::GitHub Release ${TARGET_TAG} not found in repository ${{ github.repository }}."
            exit 1
          fi

          echo "Inspecting release assets in all-desktop-dist/:"
          ls -la all-desktop-dist/

          shopt -s nullglob
          ASSETS=(
            all-desktop-dist/*.exe
            all-desktop-dist/*.dmg
            all-desktop-dist/*.deb
            all-desktop-dist/*.rpm
            all-desktop-dist/*.zip
            all-desktop-dist/*.tar.gz
          )

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to upload in all-desktop-dist/"
            exit 1
          fi

          echo "Found ${#ASSETS[@]} assets to publish:"
          printf ' - %s\n' "${ASSETS[@]}"

          for asset in "${ASSETS[@]}"; do
            echo "Uploading asset: ${asset} to release ${TARGET_TAG} ..."
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "${TARGET_TAG}" "${asset}" --repo "${{ github.repository }}" --clobber; then
                uploaded=1
                break
              fi
              echo "Upload failed for ${asset} (attempt ${attempt}/3). Retrying in 5s..."
              sleep 5
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed to upload ${asset} after 3 attempts."
              exit 1
            fi
          done

          echo "All desktop release assets published successfully to ${TARGET_TAG}."
