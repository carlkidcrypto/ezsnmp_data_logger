name: Desktop Distributions (EXE & DMG)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [created, published]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach desktop assets to (e.g. v2026.11.22b0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in desktop application files
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@22f04e222fa07048891327e4d34bb174d36e7bfa
        with:
          files: |
            include/**
            src/**
            interface/**
            ezsnmp_data_logger/**
            configs/**
            tools/**
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            pyproject.toml
            setup.py
            requirements.txt
            .github/workflows/build_and_publish_desktop_apps.yml

  package-desktop-apps:
    name: Package Desktop App (${{ matrix.os }})
    needs: [verify-syntax, check-source-changes]
    if: >-
      (github.event_name == 'release' && (github.event.action == 'published' || (github.event.action == 'created' && github.event.release.draft == true))) ||
      (github.event_name != 'release' && (needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer beta v2026.11.15b0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.15b0
          path: third_party/ezsnmp

      - name: Cache compiled Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\ezsnmp-netsnmp-dist
          key: ${{ runner.os }}-netsnmp-5.10.pre2-x64-902d603b

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential swig pkg-config patchelf \
              libssl-dev python3-tk rpm curl perl
            sudo bash ./tools/prepare_linux_netsnmp.sh
          macos: |
            brew install swig pkg-config openssl@3
            sudo bash ./tools/prepare_macos_netsnmp.sh
          windows: |
            choco install swig innosetup -y

      - name: Prepare Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: carlkidcrypto/shared-workflows/actions/prepare-windows-netsnmp@22f04e222fa07048891327e4d34bb174d36e7bfa
        with:
          net-snmp-version: "5.10.pre2"
          net-snmp-sha256: "7a5fc63515f0477d84fb160b6e8a2aee0196117d7e4ffe7d0fba2bdf3a8d72cc"
          arch: x64

      - name: Build C++ extension and package standalone desktop app
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.15b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform linux
          macos: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export DYLD_LIBRARY_PATH="/usr/local/lib:${DYLD_LIBRARY_PATH}"
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.15b0"
            python setup.py build_ext --inplace
            python tools/package_desktop_app.py --platform macos
          windows: |
            $ErrorActionPreference = 'Stop'
            python -m pip install --pre --upgrade pip setuptools wheel pyinstaller "ezsnmp>=2026.11.15b0"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = "C:\ezsnmp-netsnmp-dist\x64\bin\release;" + $env:PATH
            if (Test-Path "C:\ezsnmp-netsnmp-dist\x64\bin\release\netsnmp.dll") {
              Copy-Item "C:\ezsnmp-netsnmp-dist\x64\bin\release\*.dll" ezsnmp_data_logger/ -Force
            }
            if ($env:EZSNMP_OPENSSL_BIN_DIR -and (Test-Path $env:EZSNMP_OPENSSL_BIN_DIR)) {
              Copy-Item "$env:EZSNMP_OPENSSL_BIN_DIR\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\vcpkg\installed\x64-windows\bin\libcrypto*.dll") {
              Copy-Item "C:\vcpkg\installed\x64-windows\bin\libcrypto*.dll" ezsnmp_data_logger/ -Force
              Copy-Item "C:\vcpkg\installed\x64-windows\bin\libssl*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL\bin") {
              Copy-Item "C:\Program Files\OpenSSL\bin\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\bin") {
              Copy-Item "C:\Program Files\OpenSSL-Win64\bin\*.dll" ezsnmp_data_logger/ -Force
            }
            python setup.py build_ext --inplace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/package_desktop_app.py --platform windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged executable
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            ./dist/EzSnmpDataLogger cli version
          macos: |
            "./dist/EzSnmpDataLogger.app/Contents/MacOS/EzSnmpDataLogger" cli version
          windows: |
            $ErrorActionPreference = 'Stop'
            $exeSrc = (Resolve-Path ".\dist\EzSnmpDataLogger.exe").Path
            $smokeDir = Join-Path $env:TEMP ("ezsnmp-smoke-" + [System.Guid]::NewGuid().ToString("N"))
            New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
            $origPath = $env:PATH
            $webProc = $null
            try {
              $exe = Join-Path $smokeDir "EzSnmpDataLogger.exe"
              Copy-Item -Path $exeSrc -Destination $exe -Force
              Push-Location $smokeDir
              $env:PATH = "C:\Windows\System32;C:\Windows"

              $verOut = & $exe cli version 2>&1
              if ($LASTEXITCODE -ne 0) { throw "cli version failed ($LASTEXITCODE): $verOut" }
              Write-Host "cli version: $verOut"
              if ("$verOut" -notmatch "ezsnmp=yes") { throw "Expected ezsnmp=yes in version output: $verOut" }
              if ("$verOut" -notmatch "sqlite3=yes") { throw "Expected sqlite3=yes in version output: $verOut" }

              & $exe cli init-config --template demo -o demo_config.json
              if ($LASTEXITCODE -ne 0) { throw "cli init-config failed ($LASTEXITCODE)" }

              & $exe cli validate -c demo_config.json --json
              if ($LASTEXITCODE -ne 0) { throw "cli validate failed ($LASTEXITCODE)" }

              & $exe cli run --once -c demo_config.json --json
              if ($LASTEXITCODE -ne 0) { throw "cli run --once failed ($LASTEXITCODE)" }

              $webPort = 18765
              $webProc = Start-Process -FilePath $exe -ArgumentList @("gui", "--frontend", "web", "--no-browser", "--host", "127.0.0.1", "--port", "$webPort", "-c", "demo_config.json") -WorkingDirectory $smokeDir -PassThru -NoNewWindow
              $ready = $false
              for ($i = 0; $i -lt 40; $i++) {
                Start-Sleep -Milliseconds 500
                if ($webProc.HasExited) {
                  throw "Web GUI exited prematurely with code $($webProc.ExitCode)"
                }
                try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$webPort/api/version" -UseBasicParsing -TimeoutSec 2
                  if ($resp.StatusCode -eq 200) {
                    Write-Host "Web GUI /api/version: $($resp.Content)"
                    $ready = $true
                    break
                  }
                } catch {
                  # Server still starting up
                }
              }
              if (-not $ready) {
                throw "Web GUI did not become ready on http://127.0.0.1:$webPort/api/version"
              }
            } finally {
              if ($webProc -and -not $webProc.HasExited) {
                & C:\Windows\System32\taskkill.exe /T /F /PID $webProc.Id 2>$null | Out-Null
              }
              $env:PATH = $origPath
              Pop-Location -ErrorAction SilentlyContinue
              Remove-Item -Path $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
            }

      - name: Upload desktop artifacts to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  publish-release-assets:
    name: Publish Desktop Assets to GitHub Release
    needs: [verify-syntax, package-desktop-apps]
    if: >-
      (github.event_name == 'release' && (github.event.action == 'published' || (github.event.action == 'created' && github.event.release.draft == true))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-dist-*
          path: all-desktop-dist
          merge-multiple: true

      - name: Publish all desktop assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          if [ -z "$TARGET_TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TARGET_TAG" ]; then
            echo "Target release tag not specified; skipping GitHub Release asset upload."
            exit 0
          fi

          echo "Target Release Tag: ${TARGET_TAG}"
          echo "Target Repository: ${{ github.repository }}"
          if ! gh release view "${TARGET_TAG}" --repo "${{ github.repository }}"; then
            echo "::error::GitHub Release ${TARGET_TAG} not found in repository ${{ github.repository }}."
            exit 1
          fi

          echo "Inspecting release assets in all-desktop-dist/:"
          ls -la all-desktop-dist/

          shopt -s nullglob
          ASSETS=(
            all-desktop-dist/*.exe
            all-desktop-dist/*.dmg
            all-desktop-dist/*.deb
            all-desktop-dist/*.rpm
            all-desktop-dist/*.zip
            all-desktop-dist/*.tar.gz
          )

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to upload in all-desktop-dist/"
            exit 1
          fi

          echo "Found ${#ASSETS[@]} assets to publish:"
          printf ' - %s\n' "${ASSETS[@]}"

          IS_IMMUTABLE=$(gh api "repos/${{ github.repository }}/releases/tags/$TARGET_TAG" --jq '.immutable // false' 2>/dev/null || echo "false")
          if [ "$IS_IMMUTABLE" = "true" ]; then
            echo "::warning::Release ${TARGET_TAG} is immutable (GitHub Immutable Releases prevents uploading assets to an already-published release). Create a draft release first so the 'created' trigger uploads assets while mutable, or disable Immutable Releases in repository settings. Skipping gh release upload; artifacts remain attached to the workflow run."
            exit 0
          fi

          for asset in "${ASSETS[@]}"; do
            echo "Uploading asset: ${asset} to release ${TARGET_TAG} ..."
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "${TARGET_TAG}" "${asset}" --repo "${{ github.repository }}" --clobber; then
                uploaded=1
                break
              fi
              echo "Upload failed for ${asset} (attempt ${attempt}/3). Retrying in 5s..."
              sleep 5
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Failed to upload ${asset} after 3 attempts."
              exit 1
            fi
          done

          echo "All desktop release assets published successfully to ${TARGET_TAG}."
