name: Tests Python + CLI + Cross-Platform GUI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in Python source and test code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            codecov.yml
            include/**
            src/**
            interface/**
            ezsnmp_data_logger/**
            python_tests/**
            configs/**
            tools/**
            pyproject.toml
            setup.py
            requirements.txt
            .github/workflows/tests_python.yml

  python-and-gui-tests:
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential swig pkg-config patchelf \
              libsnmp-dev libssl-dev python3-tk
          macos: |
            brew install swig pkg-config net-snmp openssl@3
          windows: |
            choco install swig -y

      - name: Build self-contained extension & run pytest
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            python setup.py build_ext --inplace
            python -m pytest -v --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_py${{ matrix.python-version }}.xml --junitxml=test-results_${{ matrix.os }}_py${{ matrix.python-version }}.xml --cov-report=term
          macos: |
            export PKG_CONFIG_PATH="$(brew --prefix net-snmp)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            python setup.py build_ext --inplace
            python -m pytest -v --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_py${{ matrix.python-version }}.xml --junitxml=test-results_${{ matrix.os }}_py${{ matrix.python-version }}.xml --cov-report=term
          windows: |
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            $env:EZSNMP_DL_DISABLE_EZSNMP_LINK = "1"
            python setup.py build_ext --inplace
            python -m pytest -v --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_py${{ matrix.python-version }}.xml --junitxml=test-results_${{ matrix.os }}_py${{ matrix.python-version }}.xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_${{ matrix.os }}_py${{ matrix.python-version }}.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results_${{ matrix.os }}_py${{ matrix.python-version }}.xml
          flags: python
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
