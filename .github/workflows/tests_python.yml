name: Tests Python + CLI + Cross-Platform GUI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'cpp_tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in Python source and test code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            codecov.yml
            include/**
            src/**
            interface/**
            ezsnmp_data_logger/**
            python_tests/**
            configs/**
            tools/**
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            .github/actions/prepare-windows-netsnmp/**
            pyproject.toml
            setup.py
            requirements.txt
            .github/workflows/tests_python.yml

  python-and-gui-tests:
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Cache compiled Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\ezsnmp-netsnmp-dist
          key: ${{ runner.os }}-netsnmp-5.10.pre2-x64-${{ hashFiles('.github/actions/prepare-windows-netsnmp/action.yml') }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install system dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential swig pkg-config patchelf \
              libssl-dev python3-tk curl perl
            sudo bash ./tools/prepare_linux_netsnmp.sh
          macos: |
            brew install swig pkg-config openssl@3
            sudo bash ./tools/prepare_macos_netsnmp.sh
          windows: |
            choco install swig -y

      - name: Prepare Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows-netsnmp
        with:
          arch: x64

      - name: Build self-contained extension & run pytest
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            python setup.py build_ext --inplace
            python -m pytest -v \
              -o junit_family=legacy \
              --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_${{ matrix.python-version }}.xml \
              --junitxml=test-results_${{ matrix.os }}_${{ matrix.python-version }}.xml \
              --cov-report=term | tee test-outputs_${{ matrix.os }}_${{ matrix.python-version }}.txt
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            if [ -f .coverage ]; then python -m coverage report > pytest-coverage_${{ matrix.os }}_${{ matrix.python-version }}.txt || true; fi
            exit $TEST_EXIT_CODE
          macos: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export DYLD_LIBRARY_PATH="/usr/local/lib:${DYLD_LIBRARY_PATH}"
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            python setup.py build_ext --inplace
            python -m pytest -v \
              -o junit_family=legacy \
              --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_${{ matrix.python-version }}.xml \
              --junitxml=test-results_${{ matrix.os }}_${{ matrix.python-version }}.xml \
              --cov-report=term | tee test-outputs_${{ matrix.os }}_${{ matrix.python-version }}.txt
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            if [ -f .coverage ]; then python -m coverage report > pytest-coverage_${{ matrix.os }}_${{ matrix.python-version }}.txt || true; fi
            exit $TEST_EXIT_CODE
          windows: |
            python -m pip install --pre --upgrade pip setuptools wheel pytest pytest-cov "ezsnmp>=2026.11.4a0"
            $env:PATH = "C:\ezsnmp-netsnmp-dist\x64\bin\release;" + $env:PATH
            if (Test-Path "C:\ezsnmp-netsnmp-dist\x64\bin\release\netsnmp.dll") {
              Copy-Item "C:\ezsnmp-netsnmp-dist\x64\bin\release\*.dll" ezsnmp_data_logger/ -Force
            }
            if ($env:EZSNMP_OPENSSL_BIN_DIR -and (Test-Path $env:EZSNMP_OPENSSL_BIN_DIR)) {
              Copy-Item "$env:EZSNMP_OPENSSL_BIN_DIR\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL\bin") {
              Copy-Item "C:\Program Files\OpenSSL\bin\*.dll" ezsnmp_data_logger/ -Force
            } elseif (Test-Path "C:\Program Files\OpenSSL-Win64\bin") {
              Copy-Item "C:\Program Files\OpenSSL-Win64\bin\*.dll" ezsnmp_data_logger/ -Force
            }
            python setup.py build_ext --inplace
            python -m pytest -v `
              -o junit_family=legacy `
              --cov=ezsnmp_data_logger --cov-report=xml:coverage_${{ matrix.os }}_${{ matrix.python-version }}.xml `
              --junitxml=test-results_${{ matrix.os }}_${{ matrix.python-version }}.xml `
              --cov-report=term | Tee-Object -FilePath test-outputs_${{ matrix.os }}_${{ matrix.python-version }}.txt
            $testExitCode = $LASTEXITCODE
            if (Test-Path .coverage) {
              python -m coverage report | Out-File -Encoding utf8 pytest-coverage_${{ matrix.os }}_${{ matrix.python-version }}.txt
            }
            if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results_${{ matrix.os }}_${{ matrix.python-version }}
          path: |
            test-results_${{ matrix.os }}_${{ matrix.python-version }}.xml
            test-outputs_${{ matrix.os }}_${{ matrix.python-version }}.txt
            pytest-coverage_${{ matrix.os }}_${{ matrix.python-version }}.txt
            coverage_${{ matrix.os }}_${{ matrix.python-version }}.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage_${{ matrix.os }}_${{ matrix.python-version }}.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results_${{ matrix.os }}_${{ matrix.python-version }}.xml
          flags: python
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload JavaScript Bundle Analysis to Codecov
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.13'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          npx --yes @codecov/bundle-analyzer ezsnmp_data_logger/gui/static --bundle-name=ezsnmp-web-gui --upload-token="${CODECOV_TOKEN}" || true

  comment-pytest-coverage-report:
    runs-on: ubuntu-latest
    needs: python-and-gui-tests
    if: always() && needs.python-and-gui-tests.result != 'skipped'
    permissions:
      pull-requests: write # This is needed to create/update PR comments
      contents: write # Needed for commit comments when workflow runs on push
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pytest-results_*
          merge-multiple: false

      - name: List files
        run: ls -R pytest-results_*

      - name: Pytest coverage comment - Native
        id: pytest-coverage-native
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          title: Pytest Coverage Report - Native
          unique-id-for-comment: native-tests
          hide-badge: true
          hide-report: true
          create-new-comment: false
          hide-comment: true
          report-only-changed-files: false
          multiple-files: |
            ubuntu-latest - Native - 3.12, pytest-results_ubuntu-latest_3.12/test-outputs_ubuntu-latest_3.12.txt, pytest-results_ubuntu-latest_3.12/test-results_ubuntu-latest_3.12.xml
            ubuntu-latest - Native - 3.13, pytest-results_ubuntu-latest_3.13/test-outputs_ubuntu-latest_3.13.txt, pytest-results_ubuntu-latest_3.13/test-results_ubuntu-latest_3.13.xml
            windows-latest - Native - 3.12, pytest-results_windows-latest_3.12/test-outputs_windows-latest_3.12.txt, pytest-results_windows-latest_3.12/test-results_windows-latest_3.12.xml
            windows-latest - Native - 3.13, pytest-results_windows-latest_3.13/test-outputs_windows-latest_3.13.txt, pytest-results_windows-latest_3.13/test-results_windows-latest_3.13.xml

      - name: Strip leading newlines from Native summaryReport
        id: clean-native-report
        env:
          SUMMARY_REPORT: ${{ steps.pytest-coverage-native.outputs.summaryReport }}
        run: |
          python3 -c "
          import os, json
          report = os.environ.get('SUMMARY_REPORT', '')
          try:
              decoded = json.loads(report)
              if isinstance(decoded, str):
                  report = decoded
          except (json.JSONDecodeError, ValueError):
              pass
          lines = [line.strip() for line in report.splitlines() if line.strip()]
          report = '\n'.join(lines)
          delimiter = 'GHADELIMITER'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'report<<{delimiter}\n')
              f.write(report)
              if not report.endswith('\n'):
                  f.write('\n')
              f.write(f'{delimiter}\n')
          "

      - name: Find existing pytest coverage comment (PR) - Native
        id: find-native-comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pytest-coverage-native -->'

      - name: Post collapsible pytest coverage comment (PR) - Native
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@b13c6b3a371fec341992ce50ebda4740e3d7ed52 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-native-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pytest-coverage-native -->
            ## Pytest Coverage Report - Native 🐍
            <details>
            <summary>📊 Test Results (click to expand)</summary>

            ${{ steps.clean-native-report.outputs.report }}
            </details>

      - name: Post pytest coverage comment (Push) - Native
        if: github.event_name == 'push'
        uses: peter-evans/commit-comment@f6d60c65d05bb59f750fa51ad3de1d443ba0eb52 # v4
        with:
          body: |
            ## Pytest Coverage Report - Native 🐍
            <details>
            <summary>📊 Test Results (click to expand)</summary>

            ${{ steps.clean-native-report.outputs.report }}
            </details>

      - name: Pytest coverage comment - Homebrew
        id: pytest-coverage-homebrew
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          title: Pytest Coverage Report - Homebrew
          unique-id-for-comment: homebrew-tests
          hide-badge: true
          hide-report: true
          create-new-comment: false
          hide-comment: true
          report-only-changed-files: false
          multiple-files: |
            macos-latest - Homebrew - 3.12, pytest-results_macos-latest_3.12/test-outputs_macos-latest_3.12.txt, pytest-results_macos-latest_3.12/test-results_macos-latest_3.12.xml
            macos-latest - Homebrew - 3.13, pytest-results_macos-latest_3.13/test-outputs_macos-latest_3.13.txt, pytest-results_macos-latest_3.13/test-results_macos-latest_3.13.xml

      - name: Strip leading newlines from Homebrew summaryReport
        id: clean-homebrew-report
        env:
          SUMMARY_REPORT: ${{ steps.pytest-coverage-homebrew.outputs.summaryReport }}
        run: |
          python3 -c "
          import os, json
          report = os.environ.get('SUMMARY_REPORT', '')
          try:
              decoded = json.loads(report)
              if isinstance(decoded, str):
                  report = decoded
          except (json.JSONDecodeError, ValueError):
              pass
          lines = [line.strip() for line in report.splitlines() if line.strip()]
          report = '\n'.join(lines)
          delimiter = 'GHADELIMITER'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'report<<{delimiter}\n')
              f.write(report)
              if not report.endswith('\n'):
                  f.write('\n')
              f.write(f'{delimiter}\n')
          "

      - name: Find existing pytest coverage comment (PR) - Homebrew
        id: find-homebrew-comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pytest-coverage-homebrew -->'

      - name: Post collapsible pytest coverage comment (PR) - Homebrew
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@b13c6b3a371fec341992ce50ebda4740e3d7ed52 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-homebrew-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pytest-coverage-homebrew -->
            ## Pytest Coverage Report - Homebrew 🐍
            <details>
            <summary>📊 Test Results (click to expand)</summary>

            ${{ steps.clean-homebrew-report.outputs.report }}
            </details>

      - name: Post pytest coverage comment (Push) - Homebrew
        if: github.event_name == 'push'
        uses: peter-evans/commit-comment@f6d60c65d05bb59f750fa51ad3de1d443ba0eb52 # v4
        with:
          body: |
            ## Pytest Coverage Report - Homebrew 🐍
            <details>
            <summary>📊 Test Results (click to expand)</summary>

            ${{ steps.clean-homebrew-report.outputs.report }}
            </details>
