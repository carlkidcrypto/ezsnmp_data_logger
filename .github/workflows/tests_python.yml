name: Tests Python + CLI + Cross-Platform GUI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml
  python-and-gui-tests:
    needs: verify-syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v4

      - name: Checkout ezsnmp C++17 SessionBase layer
        uses: actions/checkout@v4
        with:
          repository: carlkidcrypto/ezsnmp
          path: subprojects/ezsnmp

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential swig pkg-config \
            libsnmp-dev libssl-dev libsqlite3-dev python3-tk

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install swig pkg-config net-snmp openssl@3 sqlite

      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install swig -y

      - name: Build extension & run pytest (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            PKG_CONFIG_PATH="$(brew --prefix net-snmp)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export PKG_CONFIG_PATH
          fi
          python -m pip install --upgrade pip setuptools wheel pytest
          python setup.py build_ext --inplace
          python -m pytest -v

      - name: Build extension & run pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest ezsnmp
          $env:EZSNMP_DL_DISABLE_EZSNMP_LINK = "1"
          python setup.py build_ext --inplace
          python -m pytest -v
