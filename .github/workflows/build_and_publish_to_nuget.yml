---
name: NuGet Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_nuget_publish.yml@3538efdfabdbcf0ae956cfc5685fd4c21a59696b
    with:
      project-path: 'bindings/csharp/EzSnmpDataLogger.csproj'
      dotnet-version: '8.0.x'
      python-version: '3.13'
      environment-name: 'build_and_publish_to_nuget'
      nuget-user: 'carlkidcrypto-nuget'
      build-runtimes: true
      runtime-matrix-json: '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"macos-latest","rid":"osx-arm64"},{"os":"windows-latest","rid":"win-x64"}]'
      prepare-windows-netsnmp: true
      net-snmp-version: '5.10.pre2'
      net-snmp-sha256: '7a5fc63515f0477d84fb160b6e8a2aee0196117d7e4ffe7d0fba2bdf3a8d72cc'
      runtime-setup-cmd: |
        if [ "${RUNNER_OS:-}" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y swig libssl-dev patchelf curl perl
          sudo bash ./tools/prepare_linux_netsnmp.sh
        elif [ "${RUNNER_OS:-}" = "macOS" ]; then
          brew install swig pkg-config openssl@3
          sudo bash ./tools/prepare_macos_netsnmp.sh
        elif [ "${RUNNER_OS:-}" = "Windows" ]; then
          choco install swig -y
        fi
      runtime-build-cmd: |
        python3 tools/prepare_sqlite3_amalgamation.py
        python3 tools/prepare_ezsnmp_source.py
        python3 tools/generate_swig_bindings.py --languages csharp --output-dir bindings/csharp/generated
        python3 bindings/csharp/build_self_contained.py
      runtime-artifact-path: 'bindings/csharp/runtimes'
      pack-setup-cmd: |
        sudo apt-get update && sudo apt-get install -y swig
        python3 tools/generate_swig_bindings.py --languages csharp --output-dir bindings/csharp/generated
      publish-github-packages: true
      github-packages-owner: 'carlkidcrypto'
      run-verify-syntax: true
    secrets:
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
