name: NuGet Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  build-runtimes:
    needs: verify-syntax
    name: Build C# native runtime for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libsnmp-dev libssl-dev patchelf
          sudo bash ./tools/prepare_linux_netsnmp.sh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install swig pkg-config net-snmp openssl@3
          sudo bash ./tools/prepare_macos_netsnmp.sh

      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install swig -y

      - name: Prepare Net-SNMP for Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows-netsnmp
        with:
          arch: x64

      - name: Build self-contained C# runtime
        shell: bash
        run: |
          python3 tools/prepare_sqlite3_amalgamation.py
          python3 tools/prepare_ezsnmp_source.py
          python3 tools/generate_swig_bindings.py --languages csharp --output-dir bindings/csharp/generated
          python3 bindings/csharp/build_self_contained.py

      - name: Upload C# runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: csharp-runtime-${{ matrix.rid }}
          path: bindings/csharp/runtimes/${{ matrix.rid }}/**

  pack-and-publish-nuget:
    name: Pack and Publish To NuGet
    runs-on: ubuntu-latest
    needs: build-runtimes
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for SWIG generation
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install SWIG (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Generate SWIG C# wrappers
        run: python3 tools/generate_swig_bindings.py --languages csharp --output-dir bindings/csharp/generated

      - name: Download all C# runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: csharp-runtime-*
          path: bindings/csharp/runtimes
          merge-multiple: true

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build and Pack NuGet Package
        run: |
          dotnet pack bindings/csharp/EzSnmpDataLogger.csproj -c Release -o dist-nuget

      - name: Upload NuGet Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: dist-nuget/*.nupkg

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push dist-nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        if: env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source --username carlkidcrypto --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/carlkidcrypto/index.json" || true
          dotnet nuget push dist-nuget/*.nupkg --api-key "$GITHUB_TOKEN" --source github --skip-duplicate || true
