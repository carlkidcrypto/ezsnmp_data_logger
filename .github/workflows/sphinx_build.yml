name: "Sphinx Docs Build"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'bindings/**'
      - 'cpp_tests/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'bindings/**'
      - 'cpp_tests/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in documentation sources
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            sphinx_docs_build/**
            docs/**
            include/**
            src/**
            .doxygen
            README.rst
            HOWTOAI.rst
            setup.py
            pyproject.toml
            .github/workflows/sphinx_build.yml

  sphinx_docs_build:
    needs: [verify-syntax, check-source-changes]
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.check-source-changes.outputs.run_job == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check out ezsnmp C++17 SessionBase layer (v2026.10.28a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.10.28a0
          path: third_party/ezsnmp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install Build Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev python3-tk doxygen swig pkg-config \
            libsnmp-dev libssl-dev

      - name: Install Pip Requirements
        run: |
          python -m pip install --pre --upgrade pip setuptools wheel "ezsnmp>=2026.10.28a0"
          python -m pip install -r sphinx_docs_build/requirements.txt
          python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build C++ SWIG extension & Run Sphinx (latest)
        run: |
          python setup.py build_ext --inplace
          mkdir -p doxygen_docs_build
          doxygen .doxygen
          cd sphinx_docs_build
          mkdir -p source/_static source/_templates
          make clean && make html SPHINXOPTS="-W"

      - name: Build landing page
        run: |
          cd sphinx_docs_build/landing
          mkdir -p source/_static source/_templates
          make html SPHINXOPTS="-W"

      - name: Ensure .nojekyll exists for GitHub Pages
        run: touch docs/.nojekyll

      - name: Upload artifact for GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy_pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: sphinx_docs_build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

  sphinx_docs_build_release:
    needs: verify-syntax
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository code at release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Check out ezsnmp C++17 SessionBase layer (v2026.10.28a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.10.28a0
          path: third_party/ezsnmp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install Build Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev python3-tk doxygen swig pkg-config \
            libsnmp-dev libssl-dev

      - name: Install Pip Requirements
        run: |
          python -m pip install --pre --upgrade pip setuptools wheel "ezsnmp>=2026.10.28a0"
          python -m pip install -r sphinx_docs_build/requirements.txt
          python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build versioned docs
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          python setup.py build_ext --inplace
          mkdir -p doxygen_docs_build
          doxygen .doxygen
          cd sphinx_docs_build
          mkdir -p source/_static source/_templates
          sphinx-build -b html -W source/ "/tmp/html_${VERSION}/"

      - name: Switch to main branch
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Copy versioned docs into docs/
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p "${{ github.workspace }}/docs"
          cp -r "/tmp/html_${VERSION}/" "${{ github.workspace }}/docs/html_${VERSION}/"

      - name: Update landing page version list
        run: |
          python3 - <<'EOF'
          import pathlib
          import re
          import sys
          from packaging.version import Version

          docs_dir = pathlib.Path("${{ github.workspace }}/docs")
          index_rst = pathlib.Path("${{ github.workspace }}/sphinx_docs_build/landing/source/index.rst")

          def version_sort_key(name):
              try:
                  return Version(name.replace("html_v", "").replace("html_V", ""))
              except Exception:
                  return Version("0.0.0")

          versions = sorted(
              [d.name for d in docs_dir.iterdir() if d.is_dir() and d.name.lower().startswith("html_v")],
              key=version_sort_key,
              reverse=True,
          )

          rst_items = ["* `Latest Alpha/Beta Version <./html/index.html>`_"]
          for v in versions:
              ver = v.replace("html_", "")
              rst_items.append(f"* `{ver} <./{v}/index.html>`_")
          versions_rst = "\n".join(rst_items)

          content = index_rst.read_text()
          new_content, sub_count = re.subn(
              r"\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END",
              f".. VERSION_LIST_START\n\n{versions_rst}\n\n.. VERSION_LIST_END",
              content,
              flags=re.DOTALL,
          )
          if sub_count == 0:
              sys.exit("ERROR: VERSION_LIST_START/VERSION_LIST_END sentinels not found")
          index_rst.write_text(new_content)
          EOF

      - name: Build landing page with updated version list
        run: |
          cd sphinx_docs_build/landing
          mkdir -p source/_static source/_templates
          make html SPHINXOPTS="-W"
          touch "${{ github.workspace }}/docs/.nojekyll"

      - name: Create Pull Request with versioned docs
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "Add versioned docs for ${{ github.event.release.tag_name }}"
          body: "Adds versioned Sphinx documentation for release `${{ github.event.release.tag_name }}`."
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
