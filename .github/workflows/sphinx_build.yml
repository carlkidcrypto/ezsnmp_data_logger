---
name: "Sphinx Docs Build"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'bindings/**'
      - 'cpp_tests/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'bindings/**'
      - 'cpp_tests/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in documentation sources
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@22f04e222fa07048891327e4d34bb174d36e7bfa
        with:
          files: |
            sphinx_docs_build/**
            docs/**
            include/**
            src/**
            .doxygen
            README.rst
            HOWTOAI.rst
            setup.py
            pyproject.toml
            .github/workflows/sphinx_build.yml

  sphinx_docs_build:
    needs: [verify-syntax, check-source-changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.check-source-changes.outputs.run_job == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_sphinx_build.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      python-version: '3.14'
      docs-dir: 'sphinx_docs_build'
      requirements-file: 'sphinx_docs_build/requirements.txt'
      extra-requirements-file: 'sphinx_docs_build/landing/requirements.txt'
      output-dir: 'docs'
      run-doxygen: true
      doxygen-config: '.doxygen'
      landing-dir: 'sphinx_docs_build/landing'
      deploy-pages: true
      pre-build-cmd: |
        git clone --depth 1 --branch v2026.11.15b0 https://github.com/carlkidcrypto/ezsnmp.git third_party/ezsnmp
        python tools/prepare_sqlite3_amalgamation.py
        sudo apt-get update
        sudo apt-get install -y g++ python3-dev python3-tk doxygen swig pkg-config libsnmp-dev libssl-dev
        python -m pip install --pre --upgrade pip setuptools wheel "ezsnmp>=2026.11.15b0"
        python setup.py build_ext --inplace

  sphinx_docs_build_release:
    needs: verify-syntax
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository code at release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Check out ezsnmp C++17 SessionBase layer (v2026.11.15b0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.15b0
          path: third_party/ezsnmp

      - name: Set up Python 3.14 env for sphinx...
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles('sphinx_docs_build/requirements.txt', 'sphinx_docs_build/landing/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
            ${{ runner.os }}-pip-

      - name: Provision embedded SQLite3 amalgamation
        run: python tools/prepare_sqlite3_amalgamation.py

      - name: Install Build Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev python3-tk doxygen swig pkg-config \
            libsnmp-dev libssl-dev

      - name: Install Pip Requirements
        run: |
          python -m pip install --pre --upgrade pip setuptools wheel "ezsnmp>=2026.11.15b0"
          python -m pip install -r sphinx_docs_build/requirements.txt
          python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build versioned docs
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          python setup.py build_ext --inplace
          mkdir -p doxygen_docs_build
          doxygen .doxygen
          cd sphinx_docs_build
          mkdir -p source/_static source/_templates
          sphinx-build -b html -W source/ "/tmp/html_${VERSION}/"

      - name: Switch to main branch
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Copy versioned docs into docs/
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          NORM_VERSION="html_v$(echo "${VERSION}" | sed -e 's/^[vV]//')"
          mkdir -p "${{ github.workspace }}/docs"
          rm -rf "${{ github.workspace }}/docs/${NORM_VERSION}"
          cp -r "/tmp/html_${VERSION}" "${{ github.workspace }}/docs/${NORM_VERSION}"

      - name: Update landing page version list
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys, shutil
          from packaging.version import Version

          docs_dir = pathlib.Path("${{ github.workspace }}/docs")
          index_rst = pathlib.Path("${{ github.workspace }}/sphinx_docs_build/landing/source/index.rst")

          # Normalize any legacy html_V* directory to html_v*
          for d in list(docs_dir.iterdir()):
              if d.is_dir() and d.name.startswith("html_V"):
                  target = docs_dir / ("html_v" + d.name[6:])
                  if not target.exists():
                      d.rename(target)
                  else:
                      shutil.rmtree(d)

          # Helper to parse version from directory name
          def parse_version(dir_name):
              clean = re.sub(r"^html_[vV]", "", dir_name)
              try:
                  return Version(clean)
              except Exception:
                  return Version("0.0.0")

          # Collect all existing versioned directories
          version_dirs = [
              d for d in docs_dir.iterdir()
              if d.is_dir() and d.name.lower().startswith("html_v")
          ]

          # Identify all published stable versions (not prereleases)
          stable_base_versions = {
              parse_version(d.name).base_version
              for d in version_dirs
              if not parse_version(d.name).is_prerelease and parse_version(d.name) != Version("0.0.0")
          }

          # Retire and prune prereleases if their stable release exists
          active_dirs = []
          for d in version_dirs:
              v = parse_version(d.name)
              if v.is_prerelease and v.base_version in stable_base_versions:
                  print(f"Retiring prerelease docs {d.name} in favor of stable {v.base_version}")
                  shutil.rmtree(d)
              else:
                  active_dirs.append(d)

          # Sort remaining versions newest first
          active_dirs.sort(key=lambda d: parse_version(d.name), reverse=True)

          # Build RST list entries (always include Latest Alpha/Beta first)
          rst_items = ["* `Latest Alpha/Beta Version <./html/index.html>`_"]
          for d in active_dirs:
              ver_str = "v" + re.sub(r"^html_[vV]", "", d.name)
              rst_items.append(f"* `{ver_str} <./{d.name}/index.html>`_")
          versions_rst = "\n".join(rst_items)

          content = index_rst.read_text(encoding="utf-8")
          new_content, sub_count = re.subn(
              r'\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END',
              f'.. VERSION_LIST_START\n\n{versions_rst}\n\n.. VERSION_LIST_END',
              content,
              flags=re.DOTALL,
          )

          if sub_count == 0:
              print("ERROR: VERSION_LIST_START/VERSION_LIST_END sentinels not found in index.rst", file=sys.stderr)
              sys.exit(1)

          index_rst.write_text(new_content, encoding="utf-8")
          print("Updated landing/source/index.rst with versions:", [d.name for d in active_dirs])
          EOF

      - name: Build landing page with updated version list
        run: |
          cd ${{ github.workspace }}/sphinx_docs_build/landing
          mkdir -p source/_static source/_templates
          make clean && make html SPHINXOPTS="-W"
          touch "${{ github.workspace }}/docs/.nojekyll"

      - name: Create Pull Request with versioned docs
        id: create-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "📚 Add versioned docs for ${{ github.event.release.tag_name }}"
          body: |
            This PR adds the versioned Sphinx documentation for release `${{ github.event.release.tag_name }}`.
            - Built from release tag: `${{ github.event.release.tag_name }}`
            - Run ID: ${{ github.run_id }}
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          labels: documentation, automated-pr
          add-paths: |
            docs/
            sphinx_docs_build/landing/source/index.rst
