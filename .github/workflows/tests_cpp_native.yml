name: Tests C++ Native

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'python_tests/**'
      - 'ezsnmp_data_logger/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'python_tests/**'
      - 'ezsnmp_data_logger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in C++ native code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            codecov.yml
            include/**
            src/**
            cpp_tests/**
            meson.build
            meson_options.txt
            CMakeLists.txt
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            tools/prepare_sqlite3_amalgamation.py
            .github/workflows/tests_cpp_native.yml

  cpp-meson-tests:
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Provision embedded SQLite3 amalgamation
        run: python3 tools/prepare_sqlite3_amalgamation.py

      - name: Install dependencies
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential meson ninja-build pkg-config \
              libssl-dev libpq-dev libgtest-dev lcov gcovr curl perl
            sudo bash ./tools/prepare_linux_netsnmp.sh
          macos: |
            brew install meson ninja pkg-config openssl@3 googletest
            sudo bash ./tools/prepare_macos_netsnmp.sh

      - name: Configure, Build & Run GoogleTest Suite
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            python3 -m pip install --upgrade pip gcovr
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
            meson setup build -Db_coverage=true
            meson compile -C build
            set +e
            meson test -C build -v
            TEST_EXIT_CODE=$?
            gcovr -r . --xml -o coverage.xml --exclude-throw-branches --exclude-unreachable-branches || ninja -C build coverage-xml || true
            cp coverage.xml build/meson-logs/coverage.xml 2>/dev/null || true
            exit $TEST_EXIT_CODE
          macos: |
            export PATH="/usr/local/bin:${PATH}"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            export DYLD_LIBRARY_PATH="/usr/local/lib:${DYLD_LIBRARY_PATH}"
            meson setup build
            meson compile -C build
            meson test -C build -v

      - name: Upload C++ coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/meson-logs/coverage.xml,./coverage.xml
          flags: cpp
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload C++ test results to Codecov
        if: always()
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/meson-logs/testlog.junit.xml
          flags: cpp
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload C++ test results artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-test-results-${{ matrix.os }}
          path: build/meson-logs/testlog.junit.xml

  comment-cpp-test-report:
    runs-on: ubuntu-latest
    needs: cpp-meson-tests
    permissions:
      pull-requests: write # Needed to create/update PR comments
      contents: write # Needed to read artifacts/content for check run
      checks: write # Needed to create/update check runs
    if: always() && github.event_name == 'pull_request' && needs.cpp-meson-tests.result != 'skipped'
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-test-results-*
          path: test-results

      - name: Publish C++ Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        with:
          files: test-results/**/testlog.junit.xml
          check_name: C++ Test Results - Native
          comment_title: C++ Test Results - Native
