name: Tests C++ Native

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'python_tests/**'
      - 'ezsnmp_data_logger/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
      - 'bindings/**'
      - 'python_tests/**'
      - 'ezsnmp_data_logger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes in C++ native code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            codecov.yml
            include/**
            src/**
            cpp_tests/**
            meson.build
            meson_options.txt
            CMakeLists.txt
            tools/prepare_sqlite3_amalgamation.py
            .github/workflows/tests_cpp_native.yml

  cpp-meson-tests:
    needs: [verify-syntax, check-source-changes]
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout ezsnmp_data_logger
        uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Provision embedded SQLite3 amalgamation
        run: python3 tools/prepare_sqlite3_amalgamation.py

      - name: Install dependencies
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential meson ninja-build pkg-config \
              libsnmp-dev libssl-dev libpq-dev libgtest-dev lcov gcovr
          macos: |
            brew install meson ninja pkg-config net-snmp openssl@3 googletest

      - name: Configure, Build & Run GoogleTest Suite
        uses: carlkidcrypto/os-specific-runner@d6494ebfd6437452a44d3f9d6633339772e95070 # v2.4.0
        with:
          linux: |
            python3 -m pip install --upgrade pip gcovr
            meson setup build -Db_coverage=true
            meson compile -C build
            meson test -C build -v
            ninja -C build coverage-xml || gcovr -r . --xml -o coverage.xml || true
          macos: |
            export PKG_CONFIG_PATH="$(brew --prefix net-snmp)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            meson setup build
            meson compile -C build
            meson test -C build -v

      - name: Upload C++ coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/meson-logs/coverage.xml,./coverage.xml
          flags: cpp
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
