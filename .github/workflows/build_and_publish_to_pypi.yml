# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: PyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  build_wheels:
    needs: verify-syntax
    name: Build wheels on ${{ matrix.os }} (${{ matrix.label || matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            label: x86_64-manylinux
            cibw-build: "*-manylinux*"
          - os: ubuntu-latest
            arch: x86_64
            label: x86_64-musllinux
            cibw-build: "*-musllinux*"
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: x86
          - os: windows-latest
            arch: ARM64

    steps:
      - uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Build and upload wheels
        uses: ./.github/actions/build-wheels
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          job-index: ${{ strategy.job-index }}
          cibw-build: ${{ matrix.cibw-build || '*' }}
          label: ${{ matrix.label || matrix.arch }}

  build-n-publish-pypi:
    name: Build and Publish To PyPi
    runs-on: ubuntu-latest
    environment: build_and_publish_to_pypi
    permissions:
      id-token: write
    needs: build_wheels

    steps:
      - uses: actions/checkout@v7

      - name: Checkout ezsnmp C++17 SessionBase layer (CalSemVer alpha v2026.11.4a0)
        uses: actions/checkout@v7
        with:
          repository: carlkidcrypto/ezsnmp
          ref: v2026.11.4a0
          path: third_party/ezsnmp

      - name: Build distribution
        uses: ./.github/actions/build-distribution

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          packages-dir: dist/
          verify-metadata: false
          skip-existing: true
          print-hash: true
