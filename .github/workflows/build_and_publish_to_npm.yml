---
name: npm Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_npm_publish.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      working-directory: 'bindings/javascript'
      node-version: '24'
      needs-python: true
      python-version: '3.13'
      setup-cmd: |
        sudo apt-get update
        sudo apt-get install -y swig libssl-dev patchelf curl perl
        sudo bash ./tools/prepare_linux_netsnmp.sh
        python3 tools/prepare_sqlite3_amalgamation.py
        python3 tools/prepare_ezsnmp_source.py
        python3 tools/generate_swig_bindings.py --languages javascript --output-dir bindings/javascript/generated
      install-cmd: 'npm ci --ignore-scripts'
      build-cmd: |
        npx node-gyp rebuild -j "$(nproc)"
        python3 ../../tools/bundle_native_package.py build/Release/ezsnmp_data_logger.node
      validate-release-tag: true
      pack-and-upload-artifact: true
      run-verify-syntax: true
