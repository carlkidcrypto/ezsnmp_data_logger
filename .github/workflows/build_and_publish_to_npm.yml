name: npm Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml

  publish-npm:
    name: Build and Publish To npm
    runs-on: ubuntu-latest
    needs: verify-syntax
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies & SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libsnmp-dev libssl-dev patchelf
          sudo bash ./tools/prepare_linux_netsnmp.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Prepare deps & generate SWIG bindings
        run: |
          python3 tools/prepare_sqlite3_amalgamation.py
          python3 tools/prepare_ezsnmp_source.py
          python3 tools/generate_swig_bindings.py --languages javascript --output-dir bindings/javascript/generated

      - name: Install Node dependencies
        working-directory: bindings/javascript
        run: npm install

      - name: Build native Node addon
        working-directory: bindings/javascript
        run: |
          npx node-gyp rebuild
          python3 ../../tools/bundle_native_package.py build/Release/ezsnmp_data_logger.node

      - name: Inspect package contents (dry-run)
        working-directory: bindings/javascript
        run: npm pack --dry-run

      - name: Pack npm tarball
        working-directory: bindings/javascript
        run: npm pack

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: bindings/javascript/*.tgz

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: bindings/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" =~ - ]] || [[ "$PACKAGE_VERSION" =~ [a-zA-Z] ]]; then
            echo "Publishing prerelease version $PACKAGE_VERSION with tag 'next'..."
            npm publish --access public --tag next
          else
            echo "Publishing release version $PACKAGE_VERSION with tag 'latest'..."
            npm publish --access public --tag latest
          fi
