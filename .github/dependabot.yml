version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Agentic workflow lock files are auto-generated by gh aw compile.
    # Dependabot should not open PRs for those manifests.
    exclude-paths:
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/*.md"
      - ".github/agents/*.md"
      - ".github/aw/*.lock.json"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for Python (root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Maintain JavaScript/Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/bindings/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain C#/.NET dependencies
  - package-ecosystem: "nuget"
    directory: "/bindings/csharp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Go dependencies
  - package-ecosystem: "gomod"
    directory: "/bindings/go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for Sphinx documentation build
  - package-ecosystem: "pip"
    directory: "/sphinx_docs_build"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Maintain dependencies for Sphinx landing page documentation build
  - package-ecosystem: "pip"
    directory: "/sphinx_docs_build/landing"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
