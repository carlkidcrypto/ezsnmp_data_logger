style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/carlkidcrypto/ezsnmp_data_logger
options:
  commits:
  commit_groups:
    title_maps:
      # Lowercase conventional commits
      feat: Features
      fix: Bug Fixes
      perf: Performance Improvements
      refactor: Code Refactoring
      docs: Documentation Updates
      chore: Maintenance
      build: Build System
      ci: Continuous Integration
      test: Tests
      style: Styles
      revert: Reverts
      # Capitalized word prefixes
      Bump: Dependency Updates
      Release: Releases
      Add: Features
      Fix: Bug Fixes
      Update: Updates & Improvements
      Refactor: Code Refactoring
      Document: Documentation Updates
      Enhance: Enhancements
      Hotfix: Critical Bug Fixes
      Initial: Initial Setup
      # Merge commits
      Merge: Merged Pull Requests
      # Fallback
      other: Other Changes
  header:
    pattern: "^\\s*((?:\\[[^\\]]+\\]\\s*)?([\\w]*)(?:\\([^)]*\\))?!?.*)$"
    pattern_maps:
      - Subject
      - Type
  notes:
    keywords:
      - BREAKING CHANGE
