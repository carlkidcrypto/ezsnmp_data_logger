# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

# Source and Test directories
sonar.sources=.
sonar.tests=python_tests,cpp_tests

# Target Python versions matching pyproject.toml (>=3.11)
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Exclude built documentation, workflows, third-party code, generated SWIG artifacts, and test code from main sources
sonar.exclusions=docs/**,.github/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,src/ezsnmp_data_logger_wrap.cxx,ezsnmp_data_logger/ezsnmp_data_logger.py,bindings/**/generated/**,bindings/**/build/**,python_tests/**,cpp_tests/**

# Exclude built documentation, workflows, tests, sample configs, and generated code from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,.github/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,src/ezsnmp_data_logger_wrap.cxx,ezsnmp_data_logger/ezsnmp_data_logger.py,bindings/**/generated/**,bindings/**/build/**,python_tests/**,cpp_tests/**,configs/**
